EMPIRE_DESIGN_elven_civ1:0 "Serene Kingdom of Senalata"
EMPIRE_DESIGN_elven_civ1_desc:0 "Xeno historians grudgingly admit the Ayleids appear to have always existed on their world. The prevailing hypothesis, whether encouraged by Ayleids or not, is that they were part of a massive interstellar empire at some distant point in pre-history. What it was called or how far it extended have long since been lost.\n\nRegardless of origins, they now seek to have a more active role outside their system. Their calm and disinterested demeanor is best not underestimated however as they have been known to be quite lethal when provoked to violence.§!\n"
EMPIRE_DESIGN_elven_civ1_both_dlc_desc:0 "Xeno historians grudgingly admit the Ayleids appear to have always existed on their world. The prevailing hypothesis, whether encouraged by Ayleids or not, is that they were part of a massive interstellar empire at some distant point in pre-history. What it was called or how far it extended have long since been lost.\n\nRegardless of origins, they now seek to have a more active role outside their system. Their calm and disinterested demeanor is best not underestimated however as they have been known to be quite lethal when provoked to violence.§!\n"
EMPIRE_DESIGN_elven_civ1_utopia_astral_planes_desc:0 "Xeno historians grudgingly admit the Ayleids appear to have always existed on their world. The prevailing hypothesis, whether encouraged by Ayleids or not, is that they were part of a massive interstellar empire at some distant point in pre-history. What it was called or how far it extended have long since been lost.\n\nRegardless of origins, they now seek to have a more active role outside their system. Their calm and disinterested demeanor is best not underestimated however as they have been known to be quite lethal when provoked to violence.§!\n"
EMPIRE_DESIGN_elven_civ1_galactic_paragons_dlc_desc:0 "Xeno historians grudgingly admit the Ayleids appear to have always existed on their world. The prevailing hypothesis, whether encouraged by Ayleids or not, is that they were part of a massive interstellar empire at some distant point in pre-history. What it was called or how far it extended have long since been lost.\n\nRegardless of origins, they now seek to have a more active role outside their system. Their calm and disinterested demeanor is best not underestimated however as they have been known to be quite lethal when provoked to violence.§!\n"

