##############

elven_leader_events.33.name:0 "Substance Abuser"
elven_leader_events.33.desc:0 "§R[deceased_leader.GetName]§!'s unhealthy lifestyle has come to its logical conclusion. After prolonged failure to report for duty, [deceased_leader.GetSheHe] was found dead. Investigation has determined overdose of an illicit substance to be the cause of death."

decision_elven_remove_tir_aranad:0 "Raze Tir Aranad"
decision_elven_remove_tir_aranad_desc:0 "Find a way to get rid of the oddly alien tower for good!"
decision_elven_remove_sentient_dragons:0 "Exterminate Sentient Dragons"
decision_elven_remove_sentient_dragons_desc:0 "Find a way to banish the dragons from our reality for good."
decision_elven_remove_gardens_of_heaven:0 "Raze Gardens of Heaven"
decision_elven_remove_gardens_of_heaven_desc:0 "Make more space by razing the useless and bourgeois Gardens of Heaven."
decision_elven_remove_malevolent_groves:0 "Burn Malevolent Groves"
decision_elven_remove_malevolent_groves_desc:0 "Use incendiary methods to clear out the Malevolent Groves."
decision_elven_remove_ice_spires:0 "Remove Ice Spires"
decision_elven_remove_ice_spires_desc:0 "Using carefully places explosives, clear out the Ice Spires."
decision_elven_remove_ice_blossoms:0 "Weed Out Ice Blossoms"
decision_elven_remove_ice_blossoms_desc:0 "Exterminate the useless fields of Ice Blossoms."
decision_elven_remove_murrpau_sanguine:0 "Exterminate Murrpau Sanguine"
decision_elven_remove_murrpau_sanguine_desc:0 "Start a program to eliminate the Murrpau scourge forever."
decision_elven_remove_feral_fairies:0 "Exterminate Omophagous Faeries"
decision_elven_remove_feral_fairies_desc:0 "Eliminate the Omophagous Faeries by any means possible."
decision_elven_remove_klepto_fairies:0 "Exterminate Kleptomanic Faeries"
decision_elven_remove_klepto_fairies_desc:0 "Purge the faeries from every perch, nook, and cranny!"
decision_elven_remove_glowing_forests:0 "Burn Glowing Forests"
decision_elven_remove_glowing_forests_desc:0 "Burn away the Glowing Forests."

