# GENERIC #
d_elven_start_ruins:0 "Ancient Ruins"
d_elven_start_ruins_desc:0 "Sparsely populated ancient dwellings that haven't been in wide use for millennia. Of little value today, but could be cleared for modern infrastructure."

# AYLEID #

d_elven_planetary_tir_aranad:0 "Tir Aranad"
d_elven_planetary_tir_aranad_desc:0 "Commonly referred to as the Eternal Tower, this immense spire is so tall it requires pressurization at its highest levels. Built at some point in pre-history, it has always been the seat of the reigning power. The tower is fashioned of stone yet appears to be impervious to even modern weaponry. Accordingly, theories as to how this can be vary wildly. Aside from housing rulers over all of history, the tower has also been the home of a number of researchers desperately trying to divine the true nature of the structure.\n§GWill be converted when terraforming into an Ecumenopolis!§!"

d_elven_planetary_frensca_tol_blocker:0 "£blocker£ Frensca Tol"
d_elven_planetary_frensca_tol_blocker_desc:0 "An immense floating continent that at first glance seems to defy physics. A closer look reveals an advanced network of ancient devices that keep the continent afloat in the sky. The origins of this continent are a hotly argued topic among academics. There are records of its existence going back millennia, but no one is clear exactly who created this wonder of science. Presently the surface is entirely wild and would require an investment in infrastructure to make it liveable.\n§GWill be converted when terraforming into an Ecumenopolis!§!"

d_elven_planetary_frensca_tol:0 "Frensca Tol"
d_elven_planetary_frensca_tol_desc:0 "An immense floating continent that at first glance seems to defy physics. A closer look reveals an advanced network of ancient devices that keep the continent afloat in the sky. The origins of this continent are a hotly argued topic among academics. There are records of its existence going back millennia, but no one is clear exactly who created this wonder of science. The overgrowth has been managed and modern infrastructure has now been added allowing the continent to be settled for perhaps the first time in several millennia.\n§GWill be converted when terraforming to an Ecumenopolis!§!"

# SIDH #

d_elven_planetary_light_of_altanis:0 "Light of Altanis"
d_elven_planetary_light_of_altanis_desc:0 "A giant pulsing beacon of light sent out into the vastness of space. A concept borne of the mind of the philosopher Altanis (during one of her famous carousing celebrations). The beacon austensibly sends a message of peace and joy to the universe itself. Whether or not the universe cares is a question still debated."

d_elven_planetary_daerlas_mina_blocker:0 "£blocker£ Daerlas Mina"
d_elven_planetary_daerlas_mina_blocker_desc:0 "Ancient Sidh legends claim that Lord Mina, tired of the constant celebratory atmosphere in his subjects, decided to construct a city for the sole purpose of merryment. Whether or not this story was true no longer matters as today the city is a non-stop party from one end to the other."

d_elven_planetary_daerlas_mina:0 "Daerlas Mina"
d_elven_planetary_daerlas_mina_desc:0 "$d_elven_planetary_daerlas_mina_blocker_desc$"

d_elven_planetary_aerostat_plantations:0 "Aerostat Plantations"
d_elven_planetary_aerostat_plantations_desc:0 "A great Sidh farmer, who's name has been lost to history, once said that crops prefer peace and quiet. Something one is hard pressed to find in any Sidh dwelling. To remedy this unfortunate situation, as well as to get unsightly crops as far away as possible, large aerostat platforms were devised which were capable of carrying vast fields of plantlife. Now the Sidh can enjoy natural beauty around their homes and also not starve."

d_elven_healing_spring:0 "Spring of Fertility"
d_elven_healing_spring_desc:0 "Existing well before written history, this wellspring has been proven to provide a boost to fertility with a small sip. It is now customary for couples the world over to make a ritual pilgrimage to taste the waters."

