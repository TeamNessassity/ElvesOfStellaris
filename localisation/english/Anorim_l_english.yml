EMPIRE_DESIGN_drow_civ1:0 "Children of Anoriel"
EMPIRE_DESIGN_drow_civ1_desc:0 "Tales preserved in mournful songs speak of how the Anorim left their original home to flee a "great evil" - the vengeful deity Galtaereth - once wronged by the Anorim's lost forebears, and bent on exacting vengeance ever since.\nThey were saved by another Goddess - Anoriel - a faint light of hope that illuminated their dark path. By their patron's guidance, or just by sheer luck, the ancient vessel survived a generational journey across the void.\nAt last, they managed to find a refuge - one star the relentess foe could not reach. A safe harbor from which the Children of Anoriel might rebuild their civilization; and perhaps in time, even learn to stand up to a divine curse?§!\n"
