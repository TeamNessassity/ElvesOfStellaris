civic_drow_eilistraee:0 "Blessed Beauty"
civic_drow_eilistraee_desc:0 "This society has a deep-rooted bardic tradition. Much of their history is recorded solely in various forms of art, encompassing everything from elaborate dance performances to profound interactive experiences. To one who seeks meaning in all things, even tragedy and sorrow are but wellsprings of inspiration."
civic_drow_eilistraee_tooltip_effects:0 ""

