d_drow_planetary_cheel_krezust:0 "Che'el K'rezust"
d_drow_planetary_cheel_krezust_desc:0 "The ancient site where the ark ship carrying our people to safety first landed and the our first city. Having been constantly expanded over the eons it is now a sprawling mega-city and is considered to be the capital of both the planet and of our culture.\n§GWill be converted when terraforming into an Ecumenopolis!§!"