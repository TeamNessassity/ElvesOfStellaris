####################################

drow_system_eilistraee_initializer_NAME:0 "Prismatic Provenance"
drow_system_eilistraee_initializer_DESC:0 "§LYour people live under the colorful skies of a prismatic star and its black hole companion.§!\n\n$system_initializer_DESC$"

####################################
# Traits
####################################

# Anorim immortality trait
trait_drow_anorim_immortality:0 "Evergleam"
trait_drow_anorim_immortality_desc:0 "Into the stars, they fled in fear, and therein found death. But among the stars, they lived in love, and therein death could not reach."
trait_drow_anorim_curse:0 "Evergloom"
trait_drow_anorim_curse_desc:0 "$eos_galtaereth_she_color$ is not done exacting revenge on those who once coveted $eos_galtaereth_her_color$ divinity."

####################################
# Origins 
####################################

origin_drow_prismatic_refuge:0 "Prismatic Refuge"
origin_drow_prismatic_refuge_desc:0 "Fleeing from an §REldritch Evil§!, the ark carrying the remnants of a fallen empire miraculously happened upon a paradise - the only star in the galaxy that offers shelter from $eos_galtaereth_her_color$ pursuit. Having recovered their strength and numbers enough to dream of tomorrow once more, the survivors turn their attention to the stars with hope reignited."
origin_tooltip_drow_prismatic_refuge_effects:0 "- Custom Star Cluster\n- $HOME_SYSTEM$$TABBED_NEW_LINE$- Located inside a ['concept_eos_planetary_nebula']$TABBED_NEW_LINE$- Contains an ['concept_eos_hazard_black_hole']$TABBED_NEW_LINE$- Contains a ['concept_eos_dangerous_wormhole']\n$HOMEWORLD$$TABBED_NEW_LINE$- $PLANETARY_FEATURES$$TABBED_NEW_LINE$$t$- ['concept_drow_planetary_feral_fairies']$TABBED_NEW_LINE$$t$- ['concept_drow_planetary_glowing_forests']$TABBED_NEW_LINE$$t$- ['concept_drow_planetary_cheel_krezust']\n- $ADDITIONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- ['concept_eos_wormhole_stabilization', £physics_research£ $tech_wormhole_stabilization$]"

origin_tooltip_drow_prismatic_refuge_settled_effects:0 "REPLACE_ME"
origin_tooltip_drow_prismatic_refuge_nomadic_effects:0 "REPLACE_ME"

####################################
# CIVICS
####################################

civic_drow_eilistraee:0 "Blessed Beauty"
civic_drow_eilistraee_desc:0 "This society has a deep-rooted bardic tradition. Much of their history is recorded solely in various forms of art, encompassing everything from elaborate dance performances to profound interactive experiences. To one who seeks meaning in all things, even tragedy and sorrow are but wellsprings of inspiration."
civic_drow_eilistraee_tooltip_effects:0 ""

########################
###      COUNCIL      ##
########################

elven_councilor_eilistraee:0 "Minister of Patronage"
elven_councilor_eilistraee_desc:0 "The $elven_councilor_eilistraee$ nurtures the development of artistic movements, ensuring that beauty may blossom wherever it sprouts, and that it is appropriately funded."

####################################
# Diplomacy
####################################

personality_eilistraeean_personality:0 "Orthae d'Aronen"
personality_eilistraeean_personality_desc:0 "Orthae d'Aronen, Holy Knights in Drowish, believe it is their sacred duty to bring order to the galaxy. Peacefully if possible but by force if necessary. They are known for being extremely loyal once friendship is established."

####################################
# Nations 
####################################

EMPIRE_DESIGN_drow_civ1:0 "Children of Anoriel"
EMPIRE_DESIGN_drow_civ1_desc:0 "Tales preserved in mournful songs speak of how the Anorim left their original home to flee a "great evil" - the vengeful deity Galtaereth - once wronged by the Anorim's lost forebears, and bent on exacting vengeance ever since.\nThey were saved by another Goddess - Anoriel - a faint light of hope that illuminated their dark path. By their patron's guidance, or just by sheer luck, the ancient vessel survived a generational journey across the void.\nAt last, they managed to find a refuge - one star the relentess foe could not reach. A safe harbor from which the Children of Anoriel might rebuild their civilization; and perhaps in time, even learn to stand up to a divine curse?§!\n"
