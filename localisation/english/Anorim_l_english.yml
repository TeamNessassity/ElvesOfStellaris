START_SCREEN_PRISMATIC_REFUGE:0 "'Not all who embark on a journey shall greet its final harbor.\nNot all who reach the final harbor shall see the journey's end.'\n\nFor generations, these words - a promise and a warning - were being passed from one generation to the next, as they dreamt of the day the §H$ELVEN_drow1_arkship_name$§! finally touched down upon the surface of a world bathed in prismatic briliance; never again to drift from star to star in fear of the encroaching darkness.\n\nThough we have achieved the promise, the warning is not to be forgotten: we remain mortal, and $eos_galtaereth_she_color$ who rendered us so shall claim us when $eos_anoriel_she_color$ who shelters us can do so no longer.\n\nThis journey must not end on another's terms."
START_SCREEN_PRISMATIC_REFUGE_NOMAD:0 "'Not all who embark on a journey shall greet its final harbor.\nNot all who reach the final harbor shall see the journey's end.'\n\nFor generations, these words - a promise and a warning - were being passed from one generation to the next, as they dreamt of the day the §H[Capital.GetName]§! could hide underneath a lighthouse of prismatic briliance; a spectral cloak the encroaching darkness could not penetrate.\n\nThough we have achieved the promise, the warning is not to be forgotten: we remain mortal, and $eos_galtaereth_she_color$ who rendered us so shall claim us when $eos_anoriel_she_color$ who shelters us can do so no longer.\n\nThis journey must not end on another's terms."

# Event Chain
elven_anorim_prismatic_refuge_chain_title:0 "Through the Shattered Glass"
elven_anorim_prismatic_refuge_chain_desc:0 "'Not all who embark on a journey shall greet its final harbor.\nNot all who reach the final harbor shall see the journey's end.'\n\nWe are all that remains of an ancient empire, built on power and hubris, and brought to ruin by the very same.\nFor millennia, we drifted through the void between stars, pursued by $eos_galtaereth_her_color$ whose divinity our ancestors once tried to usurp, $eos_galtaereth_alias_color$.\nBut at last, we have reached the promised refuge, a star blessed by $eos_anoriel_her_color$ who guides us, $eos_anoriel_alias_color$. It is here that we shall rest, recover, and rebuild. And when the time comes, break free from the chains of an ancient sin we have more than atoned for by now."

elven_anorim_prismatic_refuge_survive_poi:0 "Survive Dark Tithe"
elven_anorim_prismatic_refuge_survive_poi_desc:0 "The $eos_galtaereth_color$'s predation comes in tides that we have learned to sense. As the smothering shadow of $eos_galtaereth_her_color$ presence grows imminent, let our people seek shelter within the $eos_anoriel_color$'s prismatic cradle."
elven_anorim_prismatic_refuge_wormhole_poi:0 "Access the $EOS_EVERGLEAM_WORMHOLE$ Network"
elven_anorim_prismatic_refuge_wormhole_poi_desc:0 "Within the mirror of recollection, time and space bend around memory, and all three converge. As we recall the paths we have walked, the lightyears between destinations disappear."

EOS_ANORIM_PRISMATIC_REFUGE_ASCENSION:0 "Master Psionic Traditions"
EOS_ANORIM_PRISMATIC_REFUGE_ASCENSION_DESC:0 "Though many centuries have gone by since our kind has dared to peer into the Shroud where $eos_galtaereth_she_color$ dwells, if we are to have any hope of standing up to $eos_galtaereth_her_color$, we have no choice but to re-arm ourselves with arcane knowledge."
EOS_ANORIM_PSIONIC_TRADITIONS_FINISHED:0 "Has all Psionic Traditions"
EOS_ANORIM_PRISMATIC_REFUGE_EXPLORE_EVERGLOOM:0 "Explore $eos_nebula_evergloom$ Systems"
EOS_ANORIM_PRISMATIC_REFUGE_EXPLORE_EVERGLOOM_DESC:0 "With our ancient arts restored, we were able to retrace the path of our exile and find §H$eos_nebula_evergloom$§! once more. Be that as it may, however, it is not home that we are returning to; far from it. Beyond this point lies $eos_galtaereth_her_color$ domain, and only nightmares dwell therein.\n\nNonetheless, brave it we must if we are to end the nightmares once and for all."
EOS_ANORIM_EVERGLOOM_EXPLORATION:0 "Systems Explored"
EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_02:0 "Confront the Hostile Contacts"
EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_02_DESC:0 "The hostiles in the system are interfering with our sensors. We cannot proceed any deeper into $eos_nebula_evergloom$ until they are dealt with."
EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_03:0 "Destroy the Starflayer"
EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_03_DESC:0 "The Shroud abomination is disrupting the flow of $eos_evergloom_ripples$ in the region. Wading in would be suicidal until it is banished."
EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_04:0 "Bury the Valsharen Kyorl"
EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_04_DESC:0 "The ships bearing identifiers of the Imperial Guard appear to be broadcasting communications, but we are detecting no life-signs aboard..."
EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_05:0 "Tear down the Web"
EOS_ANORIM_PRISMATIC_REFUGE_CLEAR_EVERGLOOM_05_DESC:0 "Let the sins of the long-departed no longer bind those yet living."
EOS_ANORIM_CLEAR_SYSTEM:0 "System Secured"

EOS_ANORIM_PRISMATIC_REFUGE_EVERGLOOM_RIPPLES_PROJECT: "Attune Subspace Navigation"
EOS_ANORIM_PRISMATIC_REFUGE_EVERGLOOM_RIPPLES_PROJECT_DESC: "Hyperdrive alone is not enough to navigate $eos_nebula_evergloom$. In order to traverse the treacherous Shroud-steeped nebula, we must observe its currents and wait for favorable tides."
EOS_ANORIM_PRISMATIC_REFUGE_EVERGLOOM_04_GATE_PROJECT: "Complete the Recollection"
EOS_ANORIM_PRISMATIC_REFUGE_EVERGLOOM_04_GATE_PROJECT_DESC: "Though none who had set out from here remain among us, their memory continues to live on. They dreamed of a future too far away to reach, and when they could dream no longer, that dream passed on to us.\n\nAs we now grasp the tomorrow they longed for, their past becomes ours, our future becomes theirs, and our dreams at last become one."
EOS_ANORIM_PRISMATIC_REFUGE_EVERGLOOM_TEAR_PROJECT: "End the Nightmare"
EOS_ANORIM_PRISMATIC_REFUGE_EVERGLOOM_TEAR_PROJECT_DESC: "What was once broken will never return to its pristine form. But its shape can still be mended. Let all rueful regrets be laid to rest, and may this ruinous reverie come to an end."

EOS_LEADER_REQUIREMENT: "Has $COUNT$/$REQUIRED$ fleet(s) in orbit commanded by any leader."
EOS_NO_HOSTILES_REQUIREMENT: "No imminent danger."

elven_anorim_origin_events.101.name:0 "Shattered Glass: Flickering Glimmer"
elven_anorim_origin_events.101.desc:0 "For generations, we drifted through the §Rall-encompassing darkness§! in search of a §Gdistant shimmer§!.\n\nAt the outset of that journey, no one knew whether the vibrant brilliance we kept dreaming of truly existed, let alone when or where beyond the tenebrous horizon stretching out across infinity, it would be found.\n\nEven so, we were far too familiar with the death that lurked in the shadows. No matter how daunting the seemingly aimless search was, the pursuer on our heels was a far worse trial to confront.\nWith certain doom standing as the sole alternative, eventually faith became all we needed to push onwards.\n\nBut though none alive remember the mythical beginning of this odyssey, our refusal to forget its destination may have rewarded us at long last. Many are still too shaken to trust their eyes, yet... their hearts cannot deny the reignited spark of hope.\nWe have found the promised land, and with it, a monumental test of faith... For as the impending storm grows closer, we have chosen to stand our ground and face whatever comes.\n\nHere, all illusions shall shatter and lay the truth bare: is this but §Ran alluring flame for a flock of doomed moths§!, or..."
elven_anorim_origin_events.101.a:0 "§G...a safe harbor that we can always return to?§!"
elven_anorim_origin_events.101.b:0 "§G...an oasis that will nurture us henceforth?§!"

elven_anorim_origin_events.102.name:0 "Shattered Glass: Fading Sheen"
elven_anorim_origin_events.102.desc:0 "The screams have subsided and silence reigns...\n\nAs every other time, the $eos_galtaereth_color$ descended from $eos_galtaereth_her_color$ Enshrouded domain and raked stygian claws across the silken web, harvesting all the prey entrapped within...\n\nYet... grim silver lining though it may be, the harvest stopped abruptly this time; as if something distracted or perhaps repelled $eos_galtaereth_her_color$?\n\nEven many of those who had found themselves outside of [anorim_star.GetName]'s immediate protection largely escaped alive, though not unscathed. Still... as the surviving [root.GetName] let out a collective sigh of relief that broke the lingering silence, the ember of hope we had carried for so long has at last sparked a flame!\n\nThe $eos_anoriel_color$'s promise was no mere bedtime story spun by our ancestors to stave off despair. We have beheld $eos_anoriel_her_color$ beauty and found salvation in its blinding radiance.\n\nAnd perhaps... that should be enough.\nPerhaps after millennia of holding onto a single thread of fate, we have already found all the salvation we could possibly have hoped for.\nAnd perhaps to ask for more would be no different from the greed that paved our forebears' path unto downfall...\n\nPerhaps... But these are questions best pondered with better clarity. For now, we shall allow our people to celebrate and mourn as they see fit."
elven_anorim_origin_events.102.a:0 "The future is yet to come, but the present cannot wait."
elven_anorim_origin_events.102.b:0 "The future is yet to come, but the present cannot wait."

elven_anorim_origin_events.103.name:0 "Shattered Glass: Clouded Reflection"
elven_anorim_origin_events.103.desc:0 "$eos_anoriel_she_color$ spoke to us.\n\nNot in words or even visions. Unlike the constant smothering menace of $eos_galtaereth_alias_color$, $eos_anoriel_alias_color$'s presence remains a faint, yet comforting, warmth which we can only experience in a reverie.\nNevertheless, for the first time since escaping our forsaken motherland, that sensation has... expressed something new; more intense, more profound than before.\n\nAlas, it it not for the lack of means that we cannot decipher the meaning of those dreams, but for... fear.\n\nMournful songs passed down to us, lament the many graces our once-proud kind has lost. Two among them, eternal life and the ease with which we once bent the Shroud to our will, are the ones we miss most dearly. One was ripped away from us by $eos_galtaereth_her_color$ hand, and the other... we shed of our own accord.\nCutting ourselves off from the Shroud allowed us to escape $eos_galtaereth_color$'s notice for long enough to slip out of her domain. But at the same time, we lost the ability to commune with $eos_anoriel_color$ as well...\n\nThe fact that $eos_anoriel_she_color$ speaks to us once more, but we remain deaf, is beginning to feel more painful than $eos_galtaereth_alias_color$'s curse of mortality.\nThough it may be a disquieting question to ask ourselves, ask it we must: can §Glonging for warmth§! overcome §Rfear of the cold§!?"
elven_anorim_origin_events.103.a:0 "Is incompleteness truly preferable to nihility?"
elven_anorim_origin_events.103.b:0 "Is incompleteness truly preferable to nihility?"

elven_anorim_origin_events.201.name:0 "Shattered Glass: Creeping Gloom"
elven_anorim_origin_events.201.desc:0 "As expected, ever since we started the process of retracing our path to the Shroud, $eos_galtaereth_alias_color$'s shadow has grown deeper and heavier upon our souls.\n\nThis time, however, [root.GetSpeciesNamePlural] do not wade into the turbulent depths unprepared, alone or afraid. $eos_anoriel_alias_color$ has sensed our longing and responded with warmth. For the first time in generations, we need not guess at $eos_anoriel_her_color$ intent, need not wonder at $eos_anoriel_her_color$ actions, need not question $eos_anoriel_her_color$ love.\n\nBecause now we understand. Because now we remember.\n\nThough the memories were not made by us, they belong to us, and as we peer deeply into the prism of rememberance, the truth becomes clear as crystal: §Ghope§! is not §Rgreed§!, §Glove§! is not §Rhunger§!, and §Ggrief§! is not §Remptiness§!.\n\nEver fleeing, yet never moving forward; we have been anchored by fear for long enough.\nThrough the long exile, we survived. By reaching shelter, we found the strength to rebuild. And now, we have crossed the point of no return, leaving no question as to the next horizon ahead: the path to our freedom leads back to where we lost it.\nWhere the original sin was conceived.\nWhere divine blood was spilled.\nWhere the open wound continues to fester to this day, bleeding malice over the stars.\n\n§H$eos_nebula_evergloom$§!."
elven_anorim_origin_events.201.a:0 "Concealing scars will not undo the wounds underneath."
elven_anorim_origin_events.201.b:0 "Concealing scars will not undo the wounds underneath."

elven_anorim_origin_events.202.name:0 "Shattered Glass: Deepening Penumbra"
elven_anorim_origin_events.202.desc:0 "It had taken us many centuries to reach the safe harbor of [anorim_star.GetName]; a path of twisted turns, gruelling challenges and countless dangers that had brought us to the brink of extinction time and time again.\n\nEvery step of that soujourn was recorded in the databanks of our ancient arkship, maintained meticulously by generations of lost wanderers.\nBut retracing that millennia-long route is not how we shall return to where it started.\nBesides coordinates and star charts, [root.GetName]'s path of exile lives on through tales, carried by songs, dancing across screens, etched upon canvas; the perfect evocation of the struggle that defied mortal fate.\n\nWith the $eos_anoriel_color$'s guidance, we will gaze into the Prism and... remember all that we have never seen before. And as we remember, see it we shall for the first time."
elven_anorim_origin_events.202.a:0 "In memories, years and lightyears alike mean naught."
elven_anorim_origin_events.202.b:0 "In memories, years and lightyears alike mean naught."

elven_anorim_origin_events.203.name:0 "Shattered Glass: Encroaching Shade"
elven_anorim_origin_events.203.desc:0 "The moment the crew of [eos_evergloom_exploration_ship.GetName] awoke from the reverie of the Evergleam Prism, the sight that greeted them was one of desolation steeped in solace. It was perhaps inevitable that we should begin our retrospection here.\n\nPoets have prominently enshrined this star in legends as §H[anorim_evergloom_cluster_01.GetName]§!. Tradition has it that this was where our ancestors shed their connection to the Shroud in a desperate gambit to evade $eos_galtaereth_alias_color$'s attention for but one moment; painfully brief, yet long enough to break free from $eos_galtaereth_her_color$ cocoon.\nSo began their grand voyage amidst a boundless void with no end in sight.\n\nThough seeing it with our own eyes brings a sense of nostalgia that we wish we could share with those who had been here before, we must not forget §H$eos_nebula_evergloom$§! is not a place to carefreely sight-see. From what we know, even before becoming $eos_galtaereth_her_color$ playground, it was akin to a raging sea, where even islands offered little more than the illusion of solid ground.\n\nBefore we proceed deeper into this space, we must first learn to navigate it as the old empire once did. To that end, let us breach the Shroud here and observe the patterns of the waves ripping throughout. Only when the tides are low, and our destination is clear in sight, shall we wade into subspace.\n\nUntil then, not even for a moment can we let our guard down. Whatever nightmares now prowl this realm may be even worse than those that predated §H$eos_evergloom_empire_alias$§!'s fall."
elven_anorim_origin_events.203.a:0 "$eos_galtaereth_her_color$ presence here is smothering."
elven_anorim_origin_events.203.b:0 "$eos_galtaereth_her_color$ presence here is smothering."

elven_anorim_origin_events.204.name:0 "Shattered Glass: Swelling Eclipse"
elven_anorim_origin_events.204.desc:0 "Relief washed over the crew of [eos_evergloom_exploration_ship.GetName] upon arriving safely on the edge of §H[anorim_evergloom_cluster_02.GetName]§!. Though the first exiles may not longer be with us, the wisdom they passed on has once again guided and protected us on this perilous journey.\n\nAnd it is fitting that we should recall their legacy now, for we have arrived at a place many of them may have once called home, or close enough to one.\n§H$eos_evergloom_empire$§!'s frontier is remembered to have been a deadly and inhospitable place, yet abundant beyond measure and dotted with countless space stations and trade outposts, through which sweat, blood and tears flowed one way, and riches returned the other.\nIt should perhaps be no surprise that many modern [root.GetSpeciesNamePlural] can trace their lineage back to the outcasts, slaves and disillusioned idealists escaping the old empire's core systems to live a harsher yet somehow less cruel life here.\n\nWe were ready to see only ruins and necropoleis upon return, yet even so, nothing could have prepared us for the sheer devastation on display.\nAncient scrap floats about scarred asteroids, husks of decaying metal rest upon the surface of every world, and not a single world seems alight with civilization's signature glow.\n\nSo then... why is a raging tsunami of incoherent hails and broadcasts flooding our comms?"
elven_anorim_origin_events.204.a:0 "Be on guard! Something is not addding up..."
elven_anorim_origin_events.204.b:0 "Be on guard! Something is not addding up..."

elven_anorim_origin_events.205.name:0 "Shattered Glass: Tenebrous Void"
elven_anorim_origin_events.205.desc:0 "It was nothing.\n\nQuite literally, we were shooting at sensor hallucinations; phantom contacts with no discernible source or verifiable substance...\n\nThe anomalies seem to have subsided of their own accord for now, and neither our computers, nor scientists, nor the experiences of our ancestors can offer any explanations as to what might caused those errors.\n\nThough we appear to be alone in §H[anorim_evergloom_cluster_02.GetName]§! after all, perhaps we should be less trusting of our perception going forward..."
elven_anorim_origin_events.205.a:0 "Where we are going, we need more than eyes to see."
elven_anorim_origin_events.205.b:0 "Where we are going, we need more than eyes to see."

elven_anorim_origin_events.206.name:0 "Shattered Glass: Distant Twinkle"
elven_anorim_origin_events.206.desc:0 "In the ancestral memoirs, much is said about §H[anorim_evergloom_cluster_03.GetName]§!, but little is known. Most of the writers had themselves only heard of it in cautionary tales, superstitions and rumors.\n\nOne thing all accounts do agree on, however, is that it was a place sacred to the priesthood of the $eos_galtaereth_color$, and as [eos_evergloom_exploration_ship.GetName] is violently ripped out of subspace by the enormous star's unnaturally forceful gravity well, we are beginning to understand why...\n\n§R//LITTLE MOTHS CHASING PRETTY LIGHTS//§!\n\nWithin moments of arrival, not only the explorers, but all [root.GetSpeciesNamePlural] across the galaxy felt $eos_galtaereth_her_color$ vicious mockery reverberate through their very marrow...\n\nIf our intrusion had gone unnoticed up to this point, by the time the tides of Evergloom dragged us before $eos_galtaereth_her_color$ altar, the element of surprise had ceased to be on our side.\n\nAnd it seems that we have attracted the attention of something else as well..."
elven_anorim_origin_events.206.a:0 "Battlestations!"
elven_anorim_origin_events.206.b:0 "Battlestations!"

elven_anorim_origin_events.207.name:0 "Shattered Glass: Faint Shimmer"
elven_anorim_origin_events.207.desc:0 "Discerning the nature of the enigmatic creature we encountered in §H[anorim_evergloom_cluster_03.GetName]§! might explain our earlier navigational mishap.\nIf the old legends are true, this must have been a Starflayer; an entity that dwelt beneath §Y$eos_evergloom_ripples$§!, and was said to be anathema to souls and stars alike.\n\nAlthough solitary by nature, the people of §H$eos_evergloom_empire$§! believed that each one was a legion unto itself, and if allowed to gorge on psionic energies for long enough, it would eventually mature into its Elder form.\nThereupon, the abomination would become capable of... feats seemingly terrifying enough that the $eos_evergloom_ruler$ might sanction the annihilation of an entire colony if she suspected one to be sustenance for a growing Starflayer.\n\nGiven that one of such abilities was demonstrated to us earlier - severing and reshaping the essential subspace currents that connect §H$eos_nebula_evergloom$§! - perhaps it is no wonder that the old empire considered these horrors to be existential threats."
elven_anorim_origin_events.207.a:0 "We can only imagine the solitude of an unreachable star..."
elven_anorim_origin_events.207.b:0 "We can only imagine the solitude of an unreachable star..."

elven_anorim_origin_events.208.name:0 "Shattered Glass: Dim Glint"
elven_anorim_origin_events.208.desc:0 "The pall of terror fell heavy upon [eos_evergloom_exploration_ship.GetName] as it emerged from subspace upon the shores of §H[anorim_evergloom_cluster_04.GetName]§!.\n§H$eos_evergloom_empire_guard$§! - the Imperial Guard that once formed §H$eos_evergloom_empire$§!'s unbreakable wall - used to be garrisoned here; in great numbers guarding the sole path to the empire's core systems.\n\nAll that remains of §H$eos_evergloom_empire_guard_alias$§! now seems to be but a grim collection of gravestones clad in cracked neutronium. They are drifting now towards us with the illusion of intent, yet displaying no signs of life aboard.\nBut we shall not be fooled this time. We must remember that §H$eos_nebula_evergloom$§! is merely a stage for the scornful puppet play $eos_galtaereth_she_color$ has put up to humiliate those who had once dreamt of ascending to divinity upon $eos_galtaereth_her_color$ casket.\n\nYet, though there may have been no love lost between those flawed people and the outcasts who would become [root.GetSpeciesNamePlural], on their behalf, it disgusts us still what is revealed beneath this thin veneer of justice and punishment. No matter how righteous $eos_galtaereth_alias_color$'s indignation may be, it is not a god's place to deny us, imperfect creatures of dreams and desire, our pride."
elven_anorim_origin_events.208.a:0 "Let us give the fallen a dignified burial at last."
elven_anorim_origin_events.208.b:0 "Let us give the fallen a dignified burial at last."

elven_anorim_origin_events.209.name:0 "Shattered Glass: Fleeting Glow"
elven_anorim_origin_events.209.desc:0 "In space, the creaking of metal and sizzling of plasma left in the wake of battle cannot be heard. But as we watch the puppets released from their strings crumple and fall apart in silence, within our hearts, we can hear even the void sing a gentle lullaby.\n\nThough the lives of those already devoured by the $eos_galtaereth_color$ cannot be returned, we would like to believe that at least in being remembered and avenged, their souls may yet find peace.\n\nAnd even if not, may it at least bring solace to the living, for we shall need all the clarity and resolve to face what still lies ahead."
elven_anorim_origin_events.209.a:0 "Even gods should not court the fury of mortals scored."
elven_anorim_origin_events.209.b:0 "Even gods should not court the fury of mortals scored."

elven_anorim_origin_events.2010.name:0 "Shattered Glass: Evanescent Flash"
elven_anorim_origin_events.2010.desc:0 "The concerns brought about by our encounter with the $eos_ship_design_evergloom_starflayer_elder$ were well-founded. Although we stand at the precipice of the old empire's core, we are detecting no more §Y$eos_evergloom_ripples$§! past this point. None of the dozen stars that used to surround §H$eos_evergloom_empire_alias$§!'s old capital can be reached; their lights twinkling lonesomely in the distance.\n\nBut although our prospects for finding a conventional path to the §Y$eos_evergloom_tear$§! appear grim, we should not forget the loving gift of our §GGoddess§!.\nThe §G$EOS_EVERGLEAM_WORMHOLE$§! allows us to travel through the collective memory of our people in defiance of time and distance.\nThe only obstacle is that... very few of our ancestors had ever seen with their own eyes the system stories describe as §H[anorim_evergloom_cluster_05.GetName]§!. Even amongst the few exceptions, none remembered it fondly and seemingly wished only to forget that oppressive cage enclasped with an iron grip by the eternal §H$eos_evergloom_ruler$§! and her merciless hierarchy.\n\nBut one possibility continues to keep hope alight! Following our battle with the decayed vessels of §H$eos_evergloom_empire_guard_alias$§!, we have been able to recover various mementos, data drives and black boxes from the wreckage. Of particular interest are the memories preserved aboard the flagship, §Y$eos_evergloom_empire_titan$§!. The unyielding resilience of that vessel has kept many records safe from the ravages of both war and time. Incorporating the Imperial Guardsmen's memories into our story may be the way to finally complete the recollection of our shared past, and write a much kinder ending for all of us."
elven_anorim_origin_events.2010.a:0 "We are not here to forget, but to move beyond our past."
elven_anorim_origin_events.2010.b:0 "We are not here to forget, but to move beyond our past."

elven_anorim_origin_events.2011.name:0 "Shattered Glass: Dazzling Flicker"
elven_anorim_origin_events.2011.desc:0 "For countless millennia, our people worshipped $eos_galtaereth_alias_color$. It was through the power $eos_galtaereth_she_color$ granted that §H$eos_evergloom_empire$§! was able to subjugate the rest of §H$eos_nebula_evergloom$§! and thrive within this nightmarish realm.\nNone of $eos_galtaereth_her_color$ blessings, however, were gifts freely given. For every bit of power requested, one would have to pay a price far in excess of the boon's worth. Nonetheless, $eos_galtaereth_her_color$ terms had to be accepted, because those who failed to gain $eos_galtaereth_her_color$ favour would be left powerless. And those who were powerless would one day be sacrificed on $eos_galtaereth_her_color$ altar by the hand of someone else who sought power.\n\nUpon such foundations, the old empire was erected, and as those foundations crumbled, §H$eos_evergloom_empire_alias$§! would fall as well.\nAccording to §H$eos_evergloom_empire_guard_alias$§!'s recollections, the spark that would light the flames of the fateful rebellion was when even the §H$eos_evergloom_ruler$§! herself, the most supreme of all, could no longer meet the $eos_galtaereth_color$'s increasingly unsustainable price.\n\nOn the day of the planned coup, all would go according to plan. $eos_galtaereth_alias_color$ was subdued by a great binding ritual, the Covenant was severed, and all was ready to banish $eos_galtaereth_her_color$ from this reality forever.\n\nOf course, this part of the story is familiar to us..."
elven_anorim_origin_events.2011.a:0 "In the moment of triumph, victory alone was not enough."
elven_anorim_origin_events.2011.b:0 "In the moment of triumph, victory alone was not enough."

elven_anorim_origin_events.2012.name:0 "Shattered Glass: Dazzling Flicker"
elven_anorim_origin_events.2012.desc:0 "Still unable to abandon their Patron's teachings even as they readied to discard $eos_galtaereth_her_color$, the conspirators could not resist the lure of power over the guarantee of freedom...\n\nAnother Shroud entity manifested on the eve of the planned deicide. $eos_anoriel_her_color$ appeal to caution stayed their hand for a time, but ultimately would change very little.\nOnly a minor schism divided the conspiracy's ranks, between those who had taken $eos_anoriel_alias_color$'s warning to heart and wished to proceed with the original plan, and those who chose to not to listen.\nThe latter were in the overwhelming majority, and thus the followers of $eos_anoriel_color$ became the new order's enemies.\n\nThe rest of those exiles' story is known to us - it is ours, after all.\n\nAs for the other perspective, the forces of §H$eos_evergloom_empire_guard$§! fought for survival with viciousness unmatched in all their long history; managing to hold the line against the tide of horrors that spilled out of $eos_galtaereth_her_color$ wound. But even as they made the eldritch flood pay in blood for every system it overran, wave after wave wore down and eventually broke §H$eos_evergloom_empire_guard_alias$§!. The remainder of the empire was consumed within mere days thereafter.\n\nThough they could not save themselves, inadvertently, their resistance bought just enough time for our ancestors to escape §H$eos_nebula_evergloom$§!."
elven_anorim_origin_events.2012.a:0 "Serendipity's sense of irony is a bitter one."
elven_anorim_origin_events.2012.b:0 "Serendipity's sense of irony is a bitter one"

elven_anorim_origin_events.301.name:0 "Shattered Glass: Lustrous Glare"
elven_anorim_origin_events.301.desc:0 "With the full picture of §H$eos_evergloom_empire$§!'s last gasp complete upon the canvas of our memory, the path to §H[anorim_evergloom_cluster_05.GetName]§! lies open wide.\n\nAs we recall the Final Days, there is no telling what horrors we shall have to face. Even so, we have already confronted nightmares beyond imagining before, and come this far undeterred.\nAs the scions of a legacy once split in two and now reconciled in one shared dream, it falls to us to conclude this act with the only ending [root.GetName] can accept...\n\nFrom fall through flight, we have carried a tale of fragile fate too tragic to fizzle out. Having made fate our enemy with unfaltering faith, we shall finish this fairytale with a fight, and attain..."
elven_anorim_origin_events.301.a:0 "...freedom at last."
elven_anorim_origin_events.301.b:0 "...freedom at last."

elven_anorim_origin_events.302.name:0 "Shattered Glass: Fluttering Sparkle"
elven_anorim_origin_events.302.desc:0 "As soon as [eos_evergloom_exploration_ship.GetName] emerged from the event horizon of the dead star that once sustained a grand civilization's beating heart, $eos_galtaereth_she_color$ who shares its name extended $eos_galtaereth_her_color$ dark tendrils towards us; with hatered and disdain, more ravenously than ever before.\n\nUnmistakably, this system soaked in blood, divine and earhtly alike, is §H[anorim_evergloom_cluster_05.GetName]§!, and $eos_galtaereth_she_color$ has made it $eos_galtaereth_her_color$ lair. Though we have gotten used to the sight of ruins by now, the kind of devastation the $eos_galtaereth_color$ visited upon the old empire's motherland seems... different. The sense of intentionality is palatable, but it only resembles artistry on the surface at most; underneath is nothing more than an elaborate expression of hollow, ever insatiable, cruelty.\n\nThough stillness still pervades this lifeless space, $eos_galtaereth_her_color$ abyssal web stirs violently. It is only a matter of time until whatever we have awoken breaks through the paper-thin veil separating this place from the Shroud."
elven_anorim_origin_events.302.a:0 "Squash whatever crawls out, and tear down that accursed web."
elven_anorim_origin_events.302.b:0 "Squash whatever crawls out, and tear down that accursed web."

