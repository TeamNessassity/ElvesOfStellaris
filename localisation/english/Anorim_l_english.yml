# Error Messages
elven_anorim_origin_events.0001.name:0 "§RUNIQUE ORIGIN ERROR!§!"
elven_anorim_origin_events.0001.desc:0 "The §Y$origin_drow_prismatic_refuge$§! Origin could not be set up correctly for this player!\n\nReason: §RGlobal Event Target Mismatch§!\nDetails: §H[capital.solar_system.GetName]§! is NOT same value as §H[anorim_star.GetName]§!\nOR: §H[anorim_star.GetName]§! does NOT exist\n\n§RPlease Note:§! This Origin can only support one player. Duplicate players will not be able to interact with its mechanics.\nPlease start a New Game and make sure that only one Empire with the §Y$origin_drow_prismatic_refuge$§! Origin is allowed to spawn.\nIf the issue persists, please check for Stellaris version mismatch and mod conflicts before reporting it."
elven_anorim_origin_events.0001.a:0 "Oops!"

