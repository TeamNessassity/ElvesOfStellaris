# Nations 
####################################

EMPIRE_DESIGN_drow_civ1:0 "Children of Anoriel"
EMPIRE_DESIGN_drow_civ1_desc:0 "Tales say the Anorim left their original home to flee a "great evil". Guided by their Goddess Anoriel or just by sheer luck, their primitive vessel survived the traversal of a wormhole. On the other side they found a paradise world where they have remained content for many millennia.\n\nRecently their curiosity has been stirred and they are once again looking to the stars. This time to spread a message of peace and hope. By force if necessary.§!\n"
