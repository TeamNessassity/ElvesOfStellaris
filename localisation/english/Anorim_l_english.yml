START_SCREEN_PRISMATIC_REFUGE:0 "'Not all who embark on a journey shall greet its final harbor.\nNot all who reach the final harbor shall see the journey's end.'\n\nFor generations, these words - a promise and a warning - were being passed from one generation to the next, as they dreamt of the day the §H$ELVEN_drow1_arkship_name$§! finally touched down upon the surface of a world bathed in prismatic briliance; never again to drift from star to star in fear of the encroaching darkness.\n\nThough we have achieved the promise, the warning is not to be forgotten: we remain mortal, and $eos_galtaereth_she_color$ who rendered us so shall claim us when $eos_anoriel_she_color$ who shelters us can do so no longer.\n\nThis journey must not end on another's terms."
START_SCREEN_PRISMATIC_REFUGE_NOMAD:0 "'Not all who embark on a journey shall greet its final harbor.\nNot all who reach the final harbor shall see the journey's end.'\n\nFor generations, these words - a promise and a warning - were being passed from one generation to the next, as they dreamt of the day the §H[Capital.GetName]§! could hide underneath a lighthouse of prismatic briliance; a spectral cloak the encroaching darkness could not penetrate.\n\nThough we have achieved the promise, the warning is not to be forgotten: we remain mortal, and $eos_galtaereth_she_color$ who rendered us so shall claim us when $eos_anoriel_she_color$ who shelters us can do so no longer.\n\nThis journey must not end on another's terms."

# Event Chain
elven_anorim_prismatic_refuge_chain_title:0 "Through the Shattered Glass"
elven_anorim_prismatic_refuge_chain_desc:0 "'Not all who embark on a journey shall greet its final harbor.\nNot all who reach the final harbor shall see the journey's end.'\n\nWe are all that remains of an ancient empire, built on power and hubris, and brought to ruin by the very same.\nFor millennia, we drifted through the void between stars, pursued by $eos_galtaereth_her_color$ whose divinity our ancestors once tried to usurp, $eos_galtaereth_alias_color$.\nBut at last, we have reached the promised refuge, a star blessed by $eos_anoriel_her_color$ who guides us, $eos_anoriel_alias_color$. It is here that we shall rest, recover, and rebuild. And when the time comes, break free from the chains of an ancient sin we have more than atoned for by now."

elven_anorim_prismatic_refuge_survive_poi:0 "Survive Ravenous Darkness"
elven_anorim_prismatic_refuge_survive_poi_desc:0 "The $eos_galtaereth_color$'s predation comes in tides that we have learned to sense. As the smothering shadow of $eos_galtaereth_her_color$ presence grows imminent, let our people seek shelter within the $eos_anoriel_color$'s prismatic cradle."
elven_anorim_prismatic_refuge_wormhole_poi:0 "Enter The Evergloom"
elven_anorim_prismatic_refuge_wormhole_poi_desc:0 "With our ancient arts restored, we were able to retrace the path of our exile and find §H$eos_nebula_evergloom$§! once more. Be that as it may, however, it is not home that we are returning to; far from it. Beyond this point lies only $eos_galtaereth_her_color$ domain; only horrors dwell therein."

EOS_ANORIM_PRISMATIC_REFUGE_ASCENSION:0 "Complete Psionic Ascension"
EOS_ANORIM_PRISMATIC_REFUGE_ASCENSION_DESC:0 "Though many centuries have gone by since our kind has dared to peer into the Shroud, if we are to survive The Evergloom, we have no choice but to rearm ourselves with the ancient arts."
EOS_ANORIM_PSIONIC_TRADITIONS_FINISHED:0 "Has all Psionic Traditions"

