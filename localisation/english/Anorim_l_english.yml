# CIVICS
####################################

civic_drow_eilistraee:0 "Blessed Beauty"
civic_drow_eilistraee_desc:0 "This society has a deep-rooted bardic tradition. Much of their history is recorded in various forms of art, ranging from elaborate dance performances to profound interactive experiences and everything in between. As it searches for beauty, life finds meaning in a seemingly uncaring universe."
civic_drow_eilistraee_tooltip_effects:0 ""

