eos_anorim_situation_galtaereth_desc:0 "As long as $eos_galtaereth_alias_color$'s web stretches across this reality, our souls remain $eos_galtaereth_her_color$ prey.\n\nThe prismatic light of §G[target.GetName]§! offers the only shelter from the §RFeast§!."
