trait_elven_lhuren_taishanghuang_default:0 "Former Emperor"
trait_elven_lhuren_taishanghuang_female:0 "Fallen Phoenix"
trait_elven_lhuren_taishanghuang_male:0 "Fallen Dragon"
trait_elven_lhuren_taishanghuang_desc:0 "[triggered_trait_elven_lhuren_taishanghuang_desc]"
trait_elven_lhuren_taishanghuang_default_desc:0 "Whether by choice or by force, this ruler has relinquished the Celestial Grace."
trait_elven_lhuren_taishanghuang_female_desc:0 "The Phoenix Crown weighs much heavier than it appears, and few can bear the burden forever. Rather than be crushed, relinquishing it is the more dignified choice."
trait_elven_lhuren_taishanghuang_male_desc:0 "The Dragon Crown weighs much heavier than it appears, and few can bear the burden forever. Rather than be crushed, relinquishing it is the more dignified choice."

trait_elven_lhuren_taishanghuang_tooltip:0 "Cannot become Ruler again under §HCelestial Grace§!"

# Clan Concessions
