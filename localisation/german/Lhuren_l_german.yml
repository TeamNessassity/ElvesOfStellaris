 elven_lhuren_origin_events.0001.desc:0 "The §Y$origin_elven_celestial_throne$§! Origin could not be set up correctly for this player!\n\nReason: §RGlobal Event Target Mismatch§!\nDetails: §H[this.GetName]§! is NOT same value as §H[lhuren_lhumar.owner.GetName]§!\nOR: §H[lhuren_lhumar.GetName]§! does NOT have a valid owner\nOR: §H[lhuren_lhumar.GetName]§! does NOT exist\n\n§RPlease Note:§! This Origin can only support one player. Duplicate players will not be able to interact with its mechanics.\nPlease start a New Game and make sure that only one Empire with the §Y$origin_elven_celestial_throne$§! Origin is allowed to spawn."
