# Celestial Grace: Preserve the Celestial Grace
 elven_celestial_grace_events.301.name:0 "Preserve the Celestial Grace"
 elven_celestial_grace_events.301.desc:0 "In the tradition of our Empire, the mandate that grants dominion over all cosmos is not given unconditionally. An incompetent, unvirtuous or simply weary [Root.GetRulerTitle] will eventually lose the heavens' favor and face ceaceless opposition from discontent subjects as well.\n\nLikewise, rulers who have no ties to the land and the people they govern are doomed to become puppets to their own ego. After all, history has no shortage of solipstic autocrats whose vortex of self-destruction swept up entire civilizations.\n\nIf [Root.GetRulerName] is believed to have lost the Celestial Grace, for the good of the Empire, [Root.Ruler.GetSheHeCap] must..."
 elven_celestial_grace_events.301.a:0 "Appease the noble clans."
 elven_celestial_grace_events.301.b:0 "Prepare [Ruler.GetHerHisCap] heir for accession."
 elven_celestial_grace_events.301.c:0 "Yield the throne to a new dynasty."
 elven_celestial_grace_events.301.d:0 "$TRIGGER_FAIL$Think about it a little longer..."

