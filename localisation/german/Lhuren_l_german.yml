# Helemar Arc Site
 elven_lhuren_site_helemar:0 "Cosmic Caprice"
 elven_lhuren_site_helemar_intro:0 "Many centuries after settling on Lhûmar, further exploration of the cluster revealed a small world in the depths of the Dragon Nebula, concealed by background emissions. At first, surveys reported it to be nothing more than an icy rock with no traces of life. Some half a millennium later, however, a second investigation revealed a wealth of resources and a thriving ecosystem hidden just beneath the surface of the all-encompassing ocean.\n\nOf course, we did not get to witness the Gilgezu-led colonization project that was supposed to take place, as Lhûmar was preparing to bid farewell to the rest of the galaxy around the same time.\n\nIt is readily apparent, nonetheless, that the fate of Helemar has taken... an interesting turn since we last recorded it. For one, no amount of follow-up surveys can classify it as life-bearing in its current state, and yet, disturbingly...\n\nWhy are orbital scans still trying to convince us otherwise?"
 elven_lhuren_site.101.name:0 "I Wished Upon A Star"
 elven_lhuren_site.101.desc:0 "The Helemar investigation has been inundated with disruptive delays, unwelcome surprises and unforeseen complications from the moment the first plans were drafted. However, none of the bureaucratic and technical incidents could begin to stand up to the barrage of unfortunate events that nearly cost the survey crew their lives in action.\n\nAfter we realised that we could not trust any of our remote instruments to get accurate readings, an attempt was made to instead to procure samples we could investigate in the lab.\n\nIt was a terrible mistake.\n\nFortunately, our well-justified paranoia paid off and the excessive safety measures put in place were... just barely enough to preserve the lives of the researchers. Unfortunately, neither the samples nor the lab survived, setting our progress back significantly.\n\nThe one silver lining is perhaps that the sheer scope of the failure was a humiliation to all ministries involved. The singular twitch of §Y[Root.Owner.GetRulerTitle] [Root.GetRulerName]'s§! heavenly brow upon reading the shameful report did not go unnoticed by the bureaucrats, propelling them to higher standards with the realisation that their heads, too, were on the line."
 elven_lhuren_site.101.a:0 "A most auspicious beginning. Truly."
 elven_lhuren_site.102.name:0 "Thunder Took My Voice"
 elven_lhuren_site.102.desc:0 "After returning with better tools, more resources, and even one of §Y[Root.Owner.GetRulerTitle] [Root.GetRulerName]'s§! daughters with the §YFlaming Pearl§! in tow to personally oversee (and guarantee) further progress, no one should ever again underestimate the importance of this project.\n\nInitially, the presence of the §YFlaming Pearl§! and the reason for its assignment to this survey had not been disclosed to most researchers; it was for §YPrincess Linquiel§! and her entourage alone to know.\n\nHaving read the reports and noticed signs that only the Imperial Family would be familiar with, §Y[ruler.GetHerHisCap] Evershining Celestial Radiance§! came to suspect that the strange occurrences surrounding the investigation of Helemar had been far from mere bad luck. Otherworldly traces of interference clung to the disturbed strings of fate; something our history had up to this point only associated with the manifestations of §YDirac Sea Serpents§!, our incomprehensible and subtle yet ever-present benefactors. It is them that we owe our immortality to, and with their guidance that we had constructed the Eternal Array to safeguard their beloved garden of Lhûmar.\n\nThat suspicion was soon proven to be perfectly warranted... but for one detail that would have been impossible to foresee. The draconic Serpents were not the only eldritch creatures our people had encountered within the Dragon Nebula, but until today, they had been the only ones who were inclined to communicate with us. This time it was not a Dragon that the §YFlaming Pearl§! attracted, but... a §YPhoenix§!! The majestic avian form which had only been sighted a handful of times over the countless millennia of our history, and had always treated us with aloofness indistinguishable from unawareness.\n\nAs momentous as that encounter was, however, its attention lingered on the §YFlaming Pearl§! for only the briefest of moments. The §YPrincess§! immediately attempted to ask it a question, but the audience had ended before she could even utter the first word. Further attempts to make contact have thus far yielded no results, but emboldened by the auspicious event, everyone aboard has redoubled their efforts to solve whatever groundbreaking mysteries Helemar must hold."
 elven_lhuren_site.102.a:0 "Sometimes, the answer arises from the existence of a question."
 elven_lhuren_site.103.name:0 "Clouds Drowned The Sky"
 elven_lhuren_site.103.desc:0 "The Phoenix never again revealed itself, having vanished as unexpectedly as it had appeared. But it seems that our questions had not gone ignored after all; we simply could not understand the answers at the time.\n\nFollowing the fateful encounter, §YPrincess Linquiel§! began to exhibit strange behavior. At first, she was merely prone to bouts of absent-mindedness during meetings - understandable, considering how much she had to ponder - but over the following weeks, she would attempt to contact individuals who did not exist, mention events that had never happened, and even seemed confused about the details of her very own mission. From then on, it accelerated, her cognition deteriorating at a pace too rapid for any hope of recovery to remain. By the end, she was left a husk of her former self, an overactive mind trapped in an unresponsive body, whispering gibberish as she stared wide-eyed at the ceiling. The imperial entourage had no choice but to return her home to receive the best of medical care, but thus far, all treatments have failed and prognoses are grim as her condition continues to baffle the empire's brightest neurologists.\n\nThe writings she had left behind, however, were the furthest thing from the ravings of an addled mind. As her outward symptoms worsened, her journal entries and reports would launch into comprehensive tangents on quantum mechanics, in particular the concepts of imaginary time and imaginary energy. Compelling theories that posited the existence of missing variables in our understanding of the universe, alongside attempts to extrapolate their formulae. The magnum opus she had finished just before the last vestiges of awareness had slipped away was... some sort of code. Composed of over seven million lines written in an internally consistent language and syntax, yet completely incompatible with any computing system we have ever developed. We do not know its purpose yet, but one thing is clear: it is far too precise and deliberate, so a purpose it definitely serves. For §YPrincess Linquiel's§! sacrifice to mean something, it must.\n\nPerhaps... this is why Phoenixes never speak to us. As much as the enigmatic riddles of the Dragons frustrate us, at least their meaning unfolds naturally as our civilization matures enough to know the answer. But if a Phoenix may only communicate its thoughts as an explosion of all possibilities uncollapsible by a feebler observer, maybe it is out of mercy that they choose to withhold their wisdom?"
 elven_lhuren_site.103.a:0 "Today, the empire celebrates and... mourns the birth of a genius."
 elven_lhuren_site.104.name:0 "Rain Fell Without Mercy"
 elven_lhuren_site.104.desc:0 "While the enigmatic code written by §YPrincess Linquiel§! still awaits the development of an environment that can execute it, other avenues of inquiry have continued to be pursued, and at last, have yielded some results of their own.\nSamples brought up from the deadly planet that used to be known as Helemar have revealed vestigial fragments of the past, too faded to paint the full picture, yet nevertheless enough to create a rough sketch. Among the findings are metal alloys that have survived the harsh environment and passage of time, which when gathered, reconstructed and reassembled into larger components, began to resemble something uncannily familiar to us.\n\nAfter eliminating all the possible impossibilities, however unlikely the remaining theory appeared, it seemed as though the civilization of Gilgezu once attempted to build the Eternal Array on their own. It differed significantly from ours, but in many ways, the complexity of even its most basic components suggests that the design may have been even more advanced than that of Lhûmar's; a sturdier shield to withstand an even stronger storm.\nHowever... seeing the state of Helemar today, we can deduce that their efforts had met with failure. We do not know exactly what they so desperately sought refuge from, but the near-total annihilation of this world can only be attributed to a disaster of cosmic proportions...\n\nStill, although consigned to oblivion, the fate of our divergent twins is not devoid of meaning. We now have reason to believe that the key to saving ourselves, to retaining our eternity, lies in writing the continuation to their story. If we can retrace their development and reconstruct their technology, the wisdom passed down by the Phoenix's oracle shall reveal the way to salvation.\n\nIn superposition, Lhûmar and Gilgezu were to find infinite routes to salvation, yet our fates collapsed merely into disparate eigenstates of ruin. Though unable to avert theirs, our doom is yet to come, and before it does, we still stand a chance to form path integral - become one people once more, and together create a future neither could have achieved alone."
 elven_lhuren_site.104.a:0 "Across time and space, life and death, real and imaginary, we shall reunite."

# Gilgezu Arc Site
 elven_lhuren_site_gilgezu:0 "Hollow Hope"
 elven_lhuren_site_gilgezu_intro:0 "Tradition claims that when our arks first drifted into this system amidst otherworldly storms, this planet, a rare unspoiled life-bearing world, became our salvation; its humble gift of solid ground, a miracle.\n\nThe exhausted galactic wanderers decided to briefly halt their quest here, settling for some time to rest and recuperate for the journey ahead, but some would remain behind for good.\n\nEven after Lhûmar was discovered and our people proclaimed it the promised paradise, Gilgezu continued to thrive, blossoming from a mere outpost into a prosperous partner; though not as abundant in beauty and resources, no lesser in its own unique culture and innovation.\n\nThose who did not choose to join us as the Eternal Array's embrace was about to envelop Lhûmar, instead returned to Gilgezu, which had chosen a different path: to bring enlightenment to the rest of the galaxy."
 elven_lhuren_site.201.name:0 "Wayward Children"
 elven_lhuren_site.201.desc:0 "For the first few millennia, the fate of Gilgezu used to spark our imagination in idle musings and popular fiction. Would our astray brothers and sisters go on to flourish?  Would they conquer the galaxy and rule over it with an iron fist in the image of our materialistic forebears? Would they return to the stars and seek their own eternal paradise elsewhere? Would they regret not joining us?\n\nAs eternity passed, our people's interest dwindled, and their memories followed not far behind. By now, revisiting Gilgezu brings us no sense of familiarity at all... No traces of life, let alone civilization, remain on its barren husk. The few visible scars that appear too deliberate to be natural geological formations are the only... suggestions that sentient life had once touched the surface of this world. Still, it is too early to deduce the full story. Indeed, amidst the sparse evidence, a 'story' may well be all we can muster in lieu of answers."
 elven_lhuren_site.201.a:0 "Even memories fade away with time."
 elven_lhuren_site.202.name:0 "Forgotten Grave"
 elven_lhuren_site.202.desc:0 "At last, a breakthrough! Even though surface excavations continue to yield little information, something of interest was encountered deep within what remains of the planet's lithosphere. Upon closer inspection, we managed to uncover pockets of crystallized formations underneath what used to be the bottom of the ocean. The chemical composition of those country-sized deposits includes compounds that are not known to occur in nature. In other words: synthetic substances.\n\nWhile it still tells us little of Gilgezu's history, we do finally have a substantial trail of clues to follow. Although this theory remains within the realm of speculation still, it would appear that destruction was not the sole aim of the apocalypse visited upon Gilgezu. More so, whoever undertook it may have sought to remove all visible signs that a civilization had ever inhabited the world at all.\n\nHad we not known for a fact that our people once lived here, no doubt even we would have been fooled. Few others would spare this empty rock a second glance, let alone a systematic excavation effort."
 elven_lhuren_site.202.a:0 "What could be concealed here? And more alarmingly, why?"
 elven_lhuren_site.203.name:0 "Dark Forest"
 elven_lhuren_site.203.desc:0 "Following our latest findings, we no longer hoped to find any recoverable records that could verify our many hypotheses. Our surprise was thus of earth-shattering proportions when not one, but two ancient devices were somehow unearthed, one even sporting a mostly-intact data drive to boot.\n\nHowever, it quickly became apparent that the devices' origins were alien: survey probes sent from far away. One of them was only a pile of debris that had not survived the elements and solar radiation. But the second one, dated about five centuries younger than the first, was a far more sophisticated machine. We managed to reverse-engineer some parts to an extent sufficient to access the databank, but the rest remains far more advanced than anything our civilization has produced so far.\n\nThe even more chilling discoveries yet awaited us, however, within the probe's logs. According to what we could decipher, the probe used to be equipped with an AI system designed to search for specific lifesigns and send back a neutrino pulse once a match was made. And the search parameters in question? DNA sequences that match... us. Details of architecture divergent yet unmistakably rooted in our traditions. Comprehensive blueprints of grand starships and space structures that we have never constructed... yet perhaps, had our development taken a different path, we would. The last log entry made before the onboard AI self-terminated was something that could be interpreted as 'all clear'.\n\nMany questions remain, but perhaps some contain answers within themselves. Was this civilization responsible for Gilgezu's destruction? Doubtful, because mere destruction would not necessitate going to such lengths. The more likely, and more terrifying possibility, is that Gilgezu's people feared something among the stars so much that erasing the grandeur of their homeworld from the pages of history was preferable to being found by it..."
 elven_lhuren_site.203.a:0 "Let us... defer sleepless nights until after our work is done."

# Origin Event Chain: The Day You Vanished with the Stars
 START_SCREEN_ELVEN_CELESTIAL_THRONE:0 "Once upon a time, an age not even the Venerable Elders recall after tens of thousands of years of eroding memories, our people used to wander the cosmos. Disillusioned with the hollow decadence of the homeworld they had left behind, they sought a more meaningful existence among the stars.\n\nMuddled recollections speak of the final destination of their long exile. Much diminished in numbers by then, the ascetic nomads stumbled - some would claim by chance, others by fate - upon a turbulent nebula, and found their ships stranded amidst violent storms. Their retreat cut off, they resolved to push onwards in search of a temporary refuge to shield them from the cosmic anomalies. And thus they found the abundant system that we now know as our home. There, they found enlightement and transcended mortality itself.\n\nThat quaint origin myth, albeit inspiring, has always read like the vagaries of an addled imagination to the billions of us, born and grown within the cradle of the unbreakable shell enveloping our world - the only world. After all, the only 'stars' we have ever seen with our eyes were those beautiful ornaments looking down on us from the hard-light sky overhead, as mythical and metaphorical as the inky dragons and phoenixes streaking across the very same liquid mural.\n\nIf only that could have lasted forever as promised..."

 elven_lhuren_eternal_array_chain_title:0 "The Day You Vanished with the Stars"
 elven_lhuren_eternal_array_chain_desc:0 "If the promise of eternity can shatter in an instant, have we perhaps misled ourselves into treading the wrong path?\n\nEven as chaos grips our society and an incomprehensible disaster threatens our very existence, the coolest of heads must prevail and correct the course of fate. Until the crisis is averted, ancient dogma and populist rhetoric alike must be set aside in pursuit of the sole immutable truth, for all other routes lead to doom.\n\nThe process will be unimaginably complex and fraught with unknown variables, but the core philosophy is quite simple: Retrace the past to understand the present. Seize the present to shape the future."

 elven_lhuren_origin_gilgezu_poi:0 "Traces of the Past: Gilgezu"
 elven_lhuren_origin_gilgezu_poi_desc:0 "The barren husk of a once abundant world. Hereto leads the path unchosen, the validation of all fears, and yet... was our fate any kinder?"
 elven_lhuren_origin_helemar_poi:0 "Traces of the Past: Helemar"
 elven_lhuren_origin_helemar_poi_desc:0 "A once-young garden world turned hostile to any and all life. When even the universe rejects such a hopeful existence, do we accept that annihilation is the natural end to all things?"
 elven_lhuren_origin_route_A_poi:0 "Path to the Future: Anatta"
 elven_lhuren_origin_route_A_poi_desc:0 "To escape a certain doom, we must brave a path of uncertainty. Dismantling the Eternal Array's barrier module will thrust us into a future we cannot foresee, but we shall become strong enough to face whatever lies ahead.\n\nUpgrade the Megastructure: §Y$NAME_LHU_ETERNAL_ARRAY$§!"
 elven_lhuren_origin_route_B_poi:0 "Path to the Future: Samsara"
 elven_lhuren_origin_route_B_poi_desc:0 "Knowing now that the fabric of our reality is not immutable, only fools would remain static in the face of inevitable change. Reconstructing the §Y$NAME_LHU_ETERNAL_ARRAY$§! with a new design shall put our adaptability to the test; the first of many on a long and winding journey without a destination.\n\nUpgrade the Megastructure: §Y$NAME_LHU_ETERNAL_ARRAY$§!"
 elven_lhuren_origin_route_C_poi:0 "Path to the Future: Parinirvana"
 elven_lhuren_origin_route_C_poi_desc:0 "We once chose to end our tale with the 'happily ever after', yet another chapter was written against our will. Now, we shall take up the phoenix quill to rewrite destiny's tragic script, and attain the happy ending we were promised once and for all.\n\nUpgrade the Megastructure: §Y$NAME_LHU_ETERNAL_ARRAY$§!"

# Origin Event Text
 elven_lhuren_origin_events.101.name:0 "My Luck Brushes Against the Rainy Skies"
 elven_lhuren_origin_events.101.desc:0 "We were... woefully unfit to face the day the heavens fell and the searing light of unknowable stars spilled over our delusions of eternal tranquility.\n\nAs the darkness spread its tendrils across our sky, we had lost more than its reassuring immutability; we had lost our future. Millennia of certainty became naught but a bitter realisation that the one promise we trusted unconditionally had never been made, for tomorrow was no longer predestined."
 elven_lhuren_origin_events.101.a:0 "And it only got worse..."

 elven_lhuren_origin_events.102.name:0 "And Cuts Through the Barren World"
 elven_lhuren_origin_events.102.desc:0 "The Eternal Array, the titanic buttress that used to hold up the firmanent of our universe, was suspected to be malfunctioning, but such an obvious conclusion quickly made fools of us. Indeed, to the consternation of all, the Array remains immaculate, unchanged, as perfect as the day it had come to life...\n\nA crucial variable had changed, but as desperate to deny it as we are, we must delude ourselves no longer. The harsh truth may be that not only does it lie outside our bubble... but perhaps it lies outside even our control.\n\nWe set out, nonetheless, in search of answers, whatever they may be. For the first time in ages, long-fossilized archives turned into gardens of vital knowledge and wilted blueprints bloomed into spacecraft once more.\n\nThe next destination of our quest leads upstream of the river of time - to the places where the fates of our people had diverged, decisions were made, and, perhaps, so were mistakes."
 elven_lhuren_origin_events.102.a:0 "Let the past guide us towards a new future."

 elven_lhuren_origin_events.103.name:0 "As the Lights are Shining Strong"
 elven_lhuren_origin_events.103.desc:0 "The husks of Gilgezu and Helemar continue to hold mysteries that will take time and dedicated research to fully appreciate. Despite its great intellectual value, however, most of that knowledge is immaterial to the pressing concerns of our people.\n\nThe uncomfortable truth is that the Eternal Array was built with the guidance of beings who had no concept of 'entropy', making us, too, willfully oblivious of its inevitability in the universe we inhabit. Indeed, the only unchanging truth amidst the chaos we call reality is change itself.\n\nHow frustrating... although we have found answers, they do not present us with a solution.\n\nBut perhaps... such a conclusion could also be seen as liberating? For even though the path ahead of us is no more certain than the hesitant footprints we have left behind, move forward we must, into a future unknown; the sole comfort being that it is one of our own choosing."
 elven_lhuren_origin_events.103.a:0 "But this time, we understand the choice before us."

 elven_lhuren_origin_events.104.name:0 "To Forget You and All the Stars Above"
 elven_lhuren_origin_events.104.desc:0 "Not even the eldest and wisest among us can reach a consensus, but out of the countless proposals, three paths emerged as the final lifelines.\n\nThe proponents of §BAnatta§! are critical of our absolute dependency on factors we can neither control nor understand; this crisis exposing the folly of our ignorance. They suggest that we should scrap the barrier shielding our world and instead repurpose the Eternal Array towards tempering our civilization into one that can withstand entropy through its own strength.\n\nThe lobby of §GSamsara§! agrees that there is no going back to the status quo, but recommends more caution. The faction believes that the Eternal Array's shield can be stabilized via conventional means, while the Dragon Nebula's exotic properties shall be made to serve auxiliary rather than critical functions. This would offer us stable foundations as well as emergency resorts as we proceed onwards.\n\nLastly, the path of §RParinirvana§! posits that such a pivotal decision cannot be made rashly. The proponents argue that our civilization has survived for tens of thousands of years within the Eternal Array's peaceful embrace. Thus a crisis lasting a mere few years should not completely invalidate the option of continuing to do so. While aware that we can only restore the Eternal Array's full functionality for a few brief millennia at most before the transdimensional deviation becomes untenable, they are confident that we will eventually solve the underlying issue, provided that enough time and resources are dedicated to the research."
 elven_lhuren_origin_events.104.a:0 "§BDenial can no longer safeguard our eternity.§!"
 elven_lhuren_origin_events.104.a.tooltip:0 "Projected Outcome:\n- $elven_lhuren_origin_ending_A_modifier_tooltip$"
 elven_lhuren_origin_events.104.b:0 "§GWe must learn from our past failures, but not repeat them.§!"
 elven_lhuren_origin_events.104.b.tooltip:0 "Projected Outcome:\n- $elven_lhuren_origin_ending_B_modifier_tooltip$"
 elven_lhuren_origin_events.104.c:0 "§RWith time, we can solve the problem of universal entropy at its core.§!"
 elven_lhuren_origin_events.104.c.tooltip:0 "Projected Outcome:\n- Lose control of §YLhûmar§!\n- Make §YLhûmar§! indestructible\n- Lose control of the §YFlaming Pearl§!\n- Lose control of the §YCurrent Ruler§!\n- $elven_lhuren_origin_ending_C_modifier_tooltip$"

 elven_lhuren_origin_events.105.name:0 "I Cry Out 'Please Answer Me', My Voice Drying Out"
 elven_lhuren_origin_events.105.desc:0 "We shall proceed with the §BAnatta§! proposal. For too long have we languished in the refuge of solipsism, staring at shadows dancing across the wall of a tiny cave, unaware of the flames burning around us; objects of a most humiliating cosmic joke.\n\nIn order to tread the new path, however, we must first determine which of our aspects shall propel us forward, and which constitute merely dead weight. The Eternal Array, being the chronicle of our past glories and the summary proof of our ingenuity, provides us with the perfect test of this new philosophy.\n\nWe shall no longer need its shield to insulate us from the universe we now desire to master. Rather, a hammer and anvil would serve us better, that we may forge the many tools of conquest and cultivation we shall no doubt require in the coming eons."
 elven_lhuren_origin_events.105.a:0 "§BLet fear of the unknown burden us no longer!§!"
 elven_lhuren_origin_events.1051.name:0 "And All My Feelings Disappear"
 elven_lhuren_origin_events.1051.desc:0 "As was decreed by §Y[Root.Owner.GetRulerTitle] [Root.GetRulerName]§!, the painted firmament that had brought us warm comfort for millennia... was shattered - yet not by a whim of fate, as we had always feared, but by our very own hand.\n\nIn a brilliant yet disheartening display, the intricate weave of inky clouds made way for indistinct smears across a vast dark void. But let us not indulge in an excess of mourning, for in time, even richer beauty shall decorate this new canvas. The people of Lhûmar will soon be able to admire all the new stars painted in our image.\n\nBy the Celestial Mandate, we rule all that is made of stardust."
 elven_lhuren_origin_events.1051.a:0 "§BLet them kowtow or tremble; it matters not which.§!"
 elven_lhuren_origin_events.1051.b:0 "§BWe shall forge our new paradise among the stars.§!"

 elven_lhuren_origin_events.106.name:0 "Just Like the Countless Stars Washed with Blood"
 elven_lhuren_origin_events.106.desc:0 "The §GSamsara§! offers a slow but steady strategy for de-escalating the current crisis while adapting to new circumstances. As we are swept away by the violent rapids of change, the answer is neither to struggle against the current, nor to heedlessly let it carry us whither it runs.\n\nHaving already experienced the consequences of committing to a drastic course without due foresight, the decision has been made to secure a better vantage point from which we may plan our next set of moves.\nThe Eternal Array has proven too unreliable to deserve unconditional trust again, but we now know enough about the underlying principles behind its power to harness it in a more practical manner.\nBy discarding the wondrous machine's more exotic functions in favour of conventional solutions to the same problems, our capacity for reality-defying feats of physics shall be greatly diminished, yes, but the potential of selfsame 'magic' as an alternative power source cannot be understated."
 elven_lhuren_origin_events.106.a:0 "§GLet us exploit it to the fullest while we still can.§!"
 elven_lhuren_origin_events.1061.name:0 "Back on the Day You Disappeared"
 elven_lhuren_origin_events.1061.desc:0 "In the cosmic game of Go, the board is boundless and each move radiates infinite possibilities. Yet, when victory is physically impossible, to some, the game becomes all the more interesting.\n\nIf, or when, one day, Form and Substance drift far enough apart to disentangle, and existence as we know it shatters into primordial chaos, nevertheless the ripples we have made will continue to reverberate through 'space' and 'time' even as those concepts lose meaning and collapse into a singularity, at which point the sole remaining eigenstate will contain... the sum total of all. And so, as the 'universe' experiences its last distinct 'moment', it will remember us..."
 elven_lhuren_origin_events.1061.a:0 "§GAnd understand the meaning of our struggle.§!"
 elven_lhuren_origin_events.1061.b:0 "§GRemember that we once lived.§!"

 elven_lhuren_origin_events.107.name:0 "And It Engulfs Everything Into the Light"
 elven_lhuren_origin_events.107.desc:0 "While some of us have found wonder and beauty outside of the Eternal Array's peaceful refuge, it is true that the §RParinirvana§! plan echoes the sentiments of many more. Even amongst the Venerable Elders who used to roam this galaxy before Lhûmar retreated into its shell, few remember those times, and fewer yet find any familiarity in the galaxy that greeted us upon emergence.\n\nWith all we have learned over the course of the crisis, we now possess the means and knowledge to restore the Eternal Array's shielding module to its full capacity by developing an adaptive solution to the Imaginary Drift responsible for the barrier collapsing. Unfortunately... this method is merely treating the symptoms and not the disease at the core of transdimensional deviation - the natural force of entropy itself. As such, while we can return to the way things were, researchers predict that we will be facing the same problem again in another couple of millennia. That... brief reprieve, however, must be enough for us to discover a more permanent solution. Yes, the brightest minds of our species must overcome the one thing universally accepted to be inevitable. Only then will we be able to reclaim our serene eternity and consign these few years of darkness to oblivion."
 elven_lhuren_origin_events.107.a:0 "§RFor the first time in a very long time, the time is scarce.§!"
 elven_lhuren_origin_events.1071.name:0 "Letting All My Feelings Disappear"
 elven_lhuren_origin_events.1071.desc:0 "Tearful partings and last-minute changes of heart are unavoidable whenever the day of departure arrives. More so when the departees must hope, for all our sakes, that we shall never see each other again. Because should the day of reunion ever come... it would also be the day our paradise is lost.\n\nAs our people on both sides of the Eternal Array resolve to either begin a new journey, or return home, neither can truly resent the other's choice. Even as we part, we all understand, on some level, that we still rally in unison against our common enemy - the laws of an imperfect universe designed to end."
 elven_lhuren_origin_events.1071.a:0 "§RIt is time to say our final goodbye. With a smile.§!"
 elven_lhuren_origin_events.1071.b:0 "§RThough our paths diverge, purpose unites us.§!"

# Special Projects
 elven_lhuren_origin_project_repurpose:0 "Plan: Anatta"
 elven_lhuren_origin_project_repurpose_TITLE:0 "Eternal Array: Anatta"
 elven_lhuren_origin_project_repurpose_DESC:0 "The Eternal Array can no longer serve the purpose it was built for, but it can still serve a purpose. As we reach for the sky, we shall have to become proficient in building many more celestial structures like this."

 elven_lhuren_origin_project_restore:0 "Plan: Parinirvana"
 elven_lhuren_origin_project_restore_TITLE:0 "Eternal Array: Parinirvana"
 elven_lhuren_origin_project_restore_DESC:0 "We were never meant to emerge from the Eternal Array's embrace. It is only due to the universe's fundamental errors that fate had failed to unfold along its intended course. No matter. We shall adapt to the error and, in time, find a way to correct it. Though we care little for the rest of the universe, perhaps its denizens, too, will one day thank us for freeing them from the withering predations of entropy."

 # Event Buildings
 sm_lhu_array_eternity_shield_amp:0 "Rhizomator of Imaginary Metaforms"
 sm_lhu_array_eternity_shield_amp_desc:0 "Although the Eternal Array seemingly cannot be replicated outside of its specific environment, Zro-induced anomalous phenomena sometimes resonate with the same technology and can be harnessed on a small scale."

