trait_elven_lhuren_immortality_desc:0 "The members of this species are partially subject to laws borrowed from a reality of pure Form, over which entropy as we know it holds no sway."

# Celestial Favor
trait_elven_lhuren_celestial_grace:0 "[triggered_trait_elven_lhuren_celestial_grace]"
trait_elven_lhuren_celestial_grace_ruler:0 "Celestial Favor: Yellow Silk"
trait_elven_lhuren_celestial_grace_heir:0 "Celestial Favor: Yellow Silk"
trait_elven_lhuren_celestial_grace_councilor_official:0 "Celestial Favor: Crimson Quill"
trait_elven_lhuren_celestial_grace_councilor_scientist:0 "Celestial Favor: Jade Pavilion"
trait_elven_lhuren_celestial_grace_councilor_commander:0 "Celestial Favor: Azure Waters"
trait_elven_lhuren_celestial_grace_desc:0 "[triggered_trait_elven_lhuren_celestial_grace_desc]"
trait_elven_lhuren_celestial_grace_ruler_desc:0 "Those who don the Yellow Silk must renounce personal passions and aimless ambitions, for they are the curtain between the earth's desires and the heavens' will, and thus both shall be their responsibility to fulfill."
trait_elven_lhuren_celestial_grace_heir_desc:0 "Those who are born in Yellow Silk are held up as the exemplars of virtue, sharing in the earhtly duty and heavenly mandate bestowed upon the royal bloodline."
trait_elven_lhuren_celestial_grace_councilor_official_desc:0 "Those who have a strong sense of justice and desire for order are said to hold the Crimson Quill. They are expected to uphold justice, administrate territories and devise policy with impartial wisdom, experienced foresight and measured compassion."
trait_elven_lhuren_celestial_grace_councilor_scientist_desc:0 "Those who dedicate themselves to the exploration of mind and spirit form the Jade Pavillion. Intellectual enlightment and spiritual cultivation are one and the same to the physicist-philosophers, doctor-mystics and inventor-artists who seek the unfettered truth."
trait_elven_lhuren_celestial_grace_councilor_commander_desc:0 "Those who endlessly refine themselves through diligence, dedication and discipline are the Azure Waters that sustain the Empire. The masses of artisans, merchants, laborers and soldiers tend to the earth so that others may reach for the heavens."
trait_elven_lhuren_celestial_grace_subtitle:0 "§cCelestial Grace Trait§!"

# Former Emperor
