trait_elven_lhuren_concessions_desc:0 "Though still clinging to power may be against tradition, potential challengers have been convinced to respect the status quo... for now."

# Immortality Lost notification 
elven_lhuren_origin_events.301.name:0 "Answer Me... Look for Me..."
elven_lhuren_origin_events.301.desc:0 "A withering roar reverberated silently throughout the Dragon Nebula as reality collapsed into its natural state.\n\nViolently deprived of our Celestial Grace from Beyond, the gentle current of life turned into a torrent, washing us away as if we were naught but sand fighting helplessly against the oncoming tsunami..."
elven_lhuren_origin_events.301.a:0 "'Twas a grand, glorious dream we shared..."
elven_lhuren_origin_events_tooltip.301.a:0 "We return into the comfortless embrace of mortality."

