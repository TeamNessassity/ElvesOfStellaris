trait_elven_true:0 "Эльфы"
trait_elven_true_desc:0 "§LЭта цивилизация произошла от таинственных Эльдар и потому её представители являются чрезвычайно долгоживущими.§!\n"
trait_elven_savage:0 "Эльфийские дикари"
trait_elven_savage_desc:0 "§LОтветвление от таинственных Эльдар, которых обуяла дикость.§!\n"

# Immortality Traits
trait_elven_lunari_immortality:0 "Лунный свет"
trait_elven_lunari_immortality_desc:0 "Омываемые холодным светом Серебряной Луны, блаженные влачат свое невозможное существование."
trait_elven_ayleid_immortality:0 "Асцендент"
trait_elven_ayleid_immortality_desc:0 "Божественная искра вечной жизни - это лишь первое из многих прав на рождение, которые необходимо отвоевать."
trait_elven_sidh_immortality:0 "Эверблум"
trait_elven_sidh_immortality_desc:0 "Пока сохраняется равновесие природы, ее хранители должны пользоваться ее щедростью."

