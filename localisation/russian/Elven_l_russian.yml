####################################

civic_elven_arcane_minded:0 "Сообщества мистиков"
civic_elven_arcane_minded_desc:0 "Изучения метафизики является любимым делом всей нации. Причуды транцендентного обычно обсуждаются во всех слоях общества. Эта богатая почва будоражит воображение ученых."
civic_tooltip_arcane_minded_effects:0 "Slightly increased chance of discovering an §Yarchaeological site§!\n§Y20%§! of £unity£ income is converted to £physics£ £society£ £engineering£ at §Y50%§! efficiency"
#civic_tooltip_arcane_minded_effects:0 "Немного увеличивает шанс нахождения §Yместа археологических раскопок§!\n"

civic_elven_craft:0 "Элегантный артистизм"
civic_elven_craft_desc:0 "Цель - совершенство и красота во всех начинаниях. От архитектуры до космических кораблей: все должно быть столь же красиво, сколь и функционально. Данная общественная цель делает жителей счастливее, а корабли и фортификации крепче."
civic_elven_tooltip_craft_effects:0 "Счастье поселения: §G+10%§!\nПрочность корпуса: §G+5%§!\nБонус защитных фортификаций: §G+10%§!"

# New restriction text not in vanilla
civic_elven_tooltip_not_materialistic:0 "Не §YМатериалисты§!"

agenda_elven_isolationism:0 "Экономическая уверенность"

####################################
# Policies
####################################

policy_elven_gender_policy:0 "Политика в отношении полов"
policy_elven_gender_policy_desc:0 "Данная политика влияет на то, представители какого пола могут занимать те или иные позиции лидеров.\n\n§RПримечание: изменение политики не оказывает влияния на текущих лидеров и наследников!§!\n"

elven_gender_default_name:0 "Равенство"
elven_gender_default:0 "Равенство"
elven_gender_default_desc:0 "Мужчины и женщины могут становиться любыми лидерами. Что ужасно скучно. И немодно."

elven_gender_matriarchy_full_name:0 "Абсолютный матриархат"
elven_gender_matriarchy_full:0 "Абсолютный матриархат"
elven_gender_matriarchy_full_desc:0 "При данной политике делают вид, что мужчин не существует, их стараются спрятать от чужаков из страха, что может быть замечено их ограниченное чувство моды."
#"Мужчины склонны к эмоциональности и суровым суждениям. Из этого следует, что только женщины должны быть лидерами во всех слоях общества."

elven_gender_matriarchy_governor_name: "Матрилинейное лидерство"
elven_gender_matriarchy_governor:0 "Матрилинейное лидерство"
elven_gender_matriarchy_governor_desc:0 "Мужчины хорошо смотрятся в костюмах. Но не очень хорошо в мантиях. Следовательно, женщины занимают те позиции лидеров, для которых мантии абсолютно необходимы."
#"Женщины лучше приспособлены для правления и топ-менеджмента. Все правители и губернаторы - женщины."

elven_gender_patriarchy_military_name:0 "Рыцарство"
elven_gender_patriarchy_military:0 "Рыцарство"
elven_gender_patriarchy_military_desc:0 "Все знают, что мужчины лучше всего смотрятся, когда участвуют в опасных делах. Поэтому мужчины становятся всеми военными лидерами."
#"Священная обязанность мужчин - защищать слабых и беззащитных. Поэтому только мужчины допущены к ролям, связанным со сражениями."

elven_gender_patriarchy_full_name:0 "Абсолютный патриархат"
elven_gender_patriarchy_full:0 "Абсолютный патриархат"
elven_gender_patriarchy_full_desc:0 "Почему женщины должны иметь деле со скучными обязанностями лидеров? Мужчины должны выполнять эти обязанности, чтобы женщинам хватало времени на создание новых модных тенденций... и убийственных заговоров."

####################################
# Diplomacy
####################################

personality_ayleid_personality:0 "Айлейдские империалисты"
personality_ayleid_personality_desc:0 "Айлейдские империалисты верят, что они - полноправные правители всех эльфоподобных рас. Они экспансионисты, но их мало интересуют прочие расы, пока те не представляют угрозы."

personality_sidh_personality:0 "Эдельские миротворцы"
personality_sidh_personality_desc:0 "Эдельские миротворцы стараются достичь гармонии и взаимопонимания где только возможно. Как напрямую, так и через миграцию к другим цивилизациям ради провозглашения мира."

personality_gaul_personality:0 "Бдительные ремесленники"
personality_gaul_personality_desc:0 "Бдительные ремесленники, как правило, занимаются своими делами и предпочитают быть изолированными от проблем галактики. Однако, если им угрожает какая-то внешняя сила, они быстро объединяются с единой общей целью - уничтожение угрозы."

gov_elven_druid_circle:0 "Круг друидов"
gov_elven_druid_circle_desc:0 "Это правительство - спиритическая форма олигархии, где круг мудрых друидов контролирует государство. Не существует разделения между государством и кругом."

####################################
# Nations
####################################

EMPIRE_DESIGN_elven_civ1:0 "Безмятежное королевство Сенелата"
EMPIRE_DESIGN_elven_civ1_desc:0 "Ксеноисторики нехотя признают, что Айлейды, кажется, всегда существовали на своём родном мире. Основная гипотеза, независимо от того, принимают её Айлейды или нет, состоит в том, что они были частью крупной межзвездной империи задолго до первых исторических записей. Давно утеряны знания о том, как она называлась или как широко простиралась.\n\nНезависимо от происхождения, они теперь стремятся играть более активную роль за пределами своей системы. Их спокойствие и бескорыстность не следует недооценивать, поскольку, как известно, они становились смертельно опасными, когда их провоцировали на насилие.\n"
EMPIRE_DESIGN_elven_civ1_both_dlc_desc:0 "Ксеноисторики нехотя признают, что Айлейды, кажется, всегда существовали на своём родном мире. Основная гипотеза, независимо от того, принимают её Айлейды или нет, состоит в том, что они были частью крупной межзвездной империи задолго до первых исторических записей. Давно утеряны знания о том, как она называлась или как широко простиралась.\n\nНезависимо от происхождения, они теперь стремятся играть более активную роль за пределами своей системы. Их спокойствие и бескорыстность не следует недооценивать, поскольку, как известно, они становились смертельно опасными, когда их провоцировали на насилие.\n"
EMPIRE_DESIGN_elven_civ1_utopia_astral_planes_desc:0 "Ксеноисторики нехотя признают, что Айлейды, кажется, всегда существовали на своём родном мире. Основная гипотеза, независимо от того, принимают её Айлейды или нет, состоит в том, что они были частью крупной межзвездной империи задолго до первых исторических записей. Давно утеряны знания о том, как она называлась или как широко простиралась.\n\nНезависимо от происхождения, они теперь стремятся играть более активную роль за пределами своей системы. Их спокойствие и бескорыстность не следует недооценивать, поскольку, как известно, они становились смертельно опасными, когда их провоцировали на насилие.\n"
EMPIRE_DESIGN_elven_civ1_galactic_paragons_dlc_desc:0 "Ксеноисторики нехотя признают, что Айлейды, кажется, всегда существовали на своём родном мире. Основная гипотеза, независимо от того, принимают её Айлейды или нет, состоит в том, что они были частью крупной межзвездной империи задолго до первых исторических записей. Давно утеряны знания о том, как она называлась или как широко простиралась.\n\nНезависимо от происхождения, они теперь стремятся играть более активную роль за пределами своей системы. Их спокойствие и бескорыстность не следует недооценивать, поскольку, как известно, они становились смертельно опасными, когда их провоцировали на насилие.\n"

