elven_councilor_arcane_minded:0 "Архимагистр"
elven_councilor_arcane_minded_desc:0 "Рахимагистр ответственнен за исследования всего, что связано с Арканом, тем самым устраняя противоречия между научными и религиозными кругами."

elven_councilor_eilistraee:0 "Генеральный секретарь"
elven_councilor_eilistraee_desc:0 "Генеральный секретарь председательствует на заседаниях миротворческого совета и выступает в качестве представителя государства."

elven_councilor_drow_warriors:0 "Куратор шпионской сети"
elven_councilor_drow_warriors_desc:0 "Куратор шпионской сети отвечает как за зарубежную, так и за внутреннюю шпионскую сеть."