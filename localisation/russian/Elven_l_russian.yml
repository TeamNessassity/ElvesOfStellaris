elven_avari_ring_MEGASTRUCTURE_DETAILS:1 "Искусственное кольцо, которое может менять климатические условия на планете для удовлетвоерия любых пожеланий."
elven_avari_ring_CONSTRUCTION_INFO_DELAYED:2 "§YКольцо Авари§! создаёт псионические поля, которые изменяют климат планеты на комфортный для любых разумных существ, в настоящее время живущих на ней."
elven_avari_ring:0 "Кольцо Авари"
elven_avari_ring_DESC:0 "Искусственное орбитальное кольцо, которое одновременнно изменяет климат в зависимости от жителей и предоставляет простой способ транспортировки на орбиту."

elven_avari_shield_MEGASTRUCTURE_DETAILS:1 "Оборонительная структура, защищающая от бомбардировок и успокаивающая своим наличием граждан."
elven_avari_shield_CONSTRUCTION_INFO_DELAYED:2 "§YЩит Авари§! окутывает всю планету. Он защищает от атак и успокаивает население."
elven_avari_shield:0 "Щит Авари"
elven_avari_shield_DESC:0 "Окутывающий планету щит, защищающий от атак и успокаивающий население."

